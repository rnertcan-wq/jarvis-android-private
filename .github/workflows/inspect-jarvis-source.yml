name: Inspect JARVIS source archive

on:
  push:
    branches: [jarvis-1.0-dev]
    paths:
      - ".github/workflows/inspect-jarvis-source.yml"
      - "source/jarvis-jadx-build.tar.xz"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source archive
        run: |
          set -euo pipefail
          mkdir -p work
          echo "=== SOURCE ARCHIVE ==="
          ls -lh source/jarvis-jadx-build.tar.xz source/jarvis-1.0-source.tar.xz
          tar -tJf source/jarvis-jadx-build.tar.xz | tee /tmp/source-files.txt | head -300
          tar -xJf source/jarvis-jadx-build.tar.xz -C work
          ROOT=work/jarvis-jadx-build
          test -f "$ROOT/settings.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          echo "=== GRADLE / MANIFEST ==="
          for f in "$ROOT/settings.gradle" "$ROOT/build.gradle" "$ROOT/app/build.gradle" "$ROOT/app/src/main/AndroidManifest.xml"; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,260p' "$f"; fi
          done
          echo "=== SOURCE FILE LIST ==="
          find "$ROOT/app/src/main" -type f \( -name '*.kt' -o -name '*.java' \) | sort | head -400
          echo "=== KEY SOURCE FILES ==="
          find "$ROOT/app/src/main" -type f \( -name '*.kt' -o -name '*.java' \) | grep -Ei '(MainActivity|Voice|Live|Camera|Tts|Speech|Agent|Search|Telegram|Navigation|Map|Contact|Call|Service)' | head -30 | while read f; do
            echo "===== $f ====="
            sed -n '1,300p' "$f"
          done
          echo "=== EVREN / GEMINI / AUDIO / CAMERA / TELEGRAM REFERENCES ==="
          grep -RniE 'evren|gemini|speaker|onnx|AudioRecord|SpeechRecognizer|TextToSpeech|telegram|Google Maps|ACTION_WEB_SEARCH|CameraX|Camera2|PictureInPicture' "$ROOT/app/src/main" | head -500 || true
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-source-inspection
          path: work/jarvis-jadx-build/app/src/main
          if-no-files-found: error
          retention-days: 7
