name: Inspect and build JARVIS 1.0 base

on:
  push:
    branches: [jarvis-1.0-dev]
    paths:
      - ".github/workflows/inspect-jarvis-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect all available source packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/source10 work/jadx work/package

          echo "=== SOURCE ARCHIVE VALIDATION ==="
          tar -tJf source/jarvis-1.0-source.tar.xz >/tmp/source10-files.txt
          tar -tJf source/jarvis-jadx-build.tar.xz >/tmp/jadx-files.txt
          unzip -t Jarvis_GitHub_Actions_Hazirlik_Paketi.zip

          echo "=== ORIGINAL SOURCE FILE LIST ==="
          sed -n '1,400p' /tmp/source10-files.txt
          echo "=== DECOMPILED BUILD FILE LIST ==="
          sed -n '1,400p' /tmp/jadx-files.txt
          echo "=== HELPER PACKAGE FILE LIST ==="
          unzip -l Jarvis_GitHub_Actions_Hazirlik_Paketi.zip | sed -n '1,300p'

          tar -xJf source/jarvis-1.0-source.tar.xz -C work/source10
          tar -xJf source/jarvis-jadx-build.tar.xz -C work/jadx
          unzip -q Jarvis_GitHub_Actions_Hazirlik_Paketi.zip -d work/package

          echo "=== ORIGINAL SOURCE PROJECT ROOTS ==="
          find work/source10 -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml \) -type f | sort
          echo "=== ORIGINAL SOURCE JAVA/KOTLIN FILES ==="
          find work/source10 -type f \( -name '*.java' -o -name '*.kt' \) | sort | head -500
          echo "=== DECOMPILED PROJECT ROOTS ==="
          find work/jadx -maxdepth 5 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml \) -type f | sort
          echo "=== HELPER PACKAGE PROJECT ROOTS ==="
          find work/package -maxdepth 7 \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml -o -name '*.java' -o -name '*.kt' \) -type f | sort | head -500

          echo "=== ORIGINAL SOURCE GRADLE / MANIFEST ==="
          find work/source10 -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts -o -name AndroidManifest.xml \) | sort | while read f; do
            echo "===== $f ====="
            sed -n '1,260p' "$f"
          done

          echo "=== ORIGINAL SOURCE KEY CLASSES ==="
          find work/source10 -type f \( -name '*.java' -o -name '*.kt' \) | sort | grep -Ei '(Main|Evren|Voice|Live|Camera|Drive|Map|Contact|Call|Service|Owner|Speaker|Action)' | head -80 | while read f; do
            echo "===== $f ====="
            sed -E '/(api.?key|secret|token|authorization|bearer)/I s/.*/<REDACTED SECRET LINE>/' "$f" | sed -n '1,320p'
          done

          echo "=== DECOMPILED SOURCE BUILD CONFIG ==="
          for f in work/jadx/jarvis-jadx-build/settings.gradle work/jadx/jarvis-jadx-build/build.gradle work/jadx/jarvis-jadx-build/app/build.gradle work/jadx/jarvis-jadx-build/app/src/main/AndroidManifest.xml; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,260p' "$f"; fi
          done

      - name: Set up Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build decompiled base as a baseline
        working-directory: work/jadx/jarvis-jadx-build
        run: |
          set -euo pipefail
          gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Upload inspection and baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-1.0-base-inspection
          path: |
            work/source10
            work/jadx/jarvis-jadx-build/app/build/outputs/apk/debug/*.apk
            work/jadx/jarvis-jadx-build/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
