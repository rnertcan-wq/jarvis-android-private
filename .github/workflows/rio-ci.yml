name: RIO AI 0.2.1 APK Build
on:
  push:
    branches:
      - rio-ai-0-2-1-ci
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Reassemble RIO source archive
        shell: bash
        run: |
          set -euxo pipefail
          cat rio-build/parts/part*.b64 | base64 --decode > /tmp/rio-source.zip
          echo 'efc174d11db6245c873fbf2ebfe9a66dd41ef86e99daadc663e2bc2e4823ad4a  /tmp/rio-source.zip' | sha256sum -c -
          mkdir -p build-source
          unzip -q /tmp/rio-source.zip -d build-source
          chmod +x build-source/RIO_GitHub_Derleme/gradlew
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Android 36 packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build RIO and test
        working-directory: build-source/RIO_GitHub_Derleme
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build-source/RIO_GitHub_Derleme/app/build/outputs/apk/debug/app-debug.apk artifacts/RIO-AI-0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/RIO-AI-0.2.1-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 artifacts/RIO-AI-0.2.1-debug.apk
          (cd artifacts && sha256sum RIO-AI-0.2.1-debug.apk > SHA256SUMS.txt)
      - name: Upload RIO APK
        uses: actions/upload-artifact@v4
        with:
          name: RIO-AI-0.2.1-APK
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RIO-AI-build-diagnostics
          path: |
            build-source/RIO_GitHub_Derleme/app/build/reports/
            build-source/RIO_GitHub_Derleme/app/build/test-results/
          if-no-files-found: warn
          retention-days: 7
