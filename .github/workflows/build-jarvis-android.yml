name: Build JARVIS AI 2.0 Android APK

on:
  push:
    branches: [jarvis-1.0-dev]
    paths:
      - "android/**"
      - ".github/workflows/build-jarvis-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jarvis-1.0-dev

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify project and build APKs
        working-directory: android
        run: |
          set -euo pipefail
          test -f settings.gradle
          test -f app/src/main/AndroidManifest.xml
          gradle --no-daemon clean testDebugUnitTest assembleDebug assembleRelease
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload APKs and test reports
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-2.0-Android-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
