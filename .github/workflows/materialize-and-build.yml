name: Materialize and build JARVIS 1.0 source

on:
  push:
    branches: [jarvis-1.0-dev]
    paths:
      - ".github/workflows/materialize-and-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jarvis-1.0-dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Materialize original source
        shell: bash
        run: |
          set -euo pipefail
          test -s source/jarvis-1.0-source.tar.xz
          mkdir -p /tmp/jarvis-source
          tar -xJf source/jarvis-1.0-source.tar.xz -C /tmp/jarvis-source
          test -f /tmp/jarvis-source/jarvis-v1-project/settings.gradle
          test -f /tmp/jarvis-source/jarvis-v1-project/app/src/main/AndroidManifest.xml
          if [ -e android ]; then
            echo "android/ already exists; refusing to overwrite source."
            exit 1
          fi
          mv /tmp/jarvis-source/jarvis-v1-project android
          cat > android/.gitignore <<'EOF'
          .gradle/
          **/build/
          local.properties
          *.jks
          *.keystore
          EOF
          echo "=== SOURCE INVENTORY ==="
          find android/app/src/main/java -type f \( -name '*.java' -o -name '*.kt' \) | sort
          echo "=== APP CONFIG ==="
          sed -n '1,240p' android/app/build.gradle

      - name: Run unit tests and build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon clean testDebugUnitTest assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Commit the materialized source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "build: materialize JARVIS Android 1.0 source project"
            git push origin HEAD:jarvis-1.0-dev
          fi

      - name: Upload APK and test results
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-1.0-baseline-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
